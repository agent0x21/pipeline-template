name: Build and promote services

run-name: ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - dev
      - qa
      - main
    paths:
      - "apps/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  packages: write

jobs:
  detect:
    name: Detect changed services
    runs-on: self-hosted

    outputs:
      services: ${{ steps.changed.outputs.services }}
      has_changes: ${{ steps.changed.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changed
        shell: bash
        run: |
          set -euo pipefail
              
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
              
          echo "Comparing:"
          echo "  before: $BEFORE"
          echo "  after:  $AFTER"
              
          # First commit on a new branch can have an all-zero BEFORE SHA.
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            if git rev-parse "${AFTER}^" >/dev/null 2>&1; then
              BEFORE="${AFTER}^"
            else
              BEFORE=""
            fi
          fi
              
          if [ -n "$BEFORE" ]; then
            CHANGED_FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
          else
            CHANGED_FILES="$(git ls-files)"
          fi
              
          echo
          echo "Changed files:"
          echo "$CHANGED_FILES"
              
          CHANGED_SERVICES="$(
            echo "$CHANGED_FILES" \
              | awk -F/ '$1 == "apps" && ($2 == "react" || $2 == "next" || $2 == "express" || $2 == "dotnet-api") { print $2 }' \
              | sort -u
          )"
              
          if [ -z "$CHANGED_SERVICES" ]; then
            echo
            echo "No service changes detected."
              
            echo 'services=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
              
          echo
          echo "Changed services:"
          echo "$CHANGED_SERVICES"
              
          JSON="$(
            echo "$CHANGED_SERVICES" \
              | jq -R . \
              | jq -s -c .
          )"
              
          echo
          echo "Service matrix: $JSON"
              
          echo "services=$JSON" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  dev-build:
    name: Build ${{ matrix.service }} for DEV

    needs:
      - detect

    if: |
      github.ref_name == 'dev' &&
      needs.detect.outputs.has_changes == 'true'

    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    concurrency:
      group: build-${{ matrix.service }}-dev
      cancel-in-progress: false

    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate service
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ matrix.service }}"

          if [ ! -f "apps/${SERVICE}/Dockerfile" ]; then
            echo "Dockerfile not found for ${SERVICE}"
            exit 1
          fi

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ matrix.service }}"
          TAG_PREFIX="${SERVICE}-v"

          LATEST_TAG="$(
            git tag \
              --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              --sort=-version:refname \
            | head -n 1
          )"

          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#${TAG_PREFIX}}"
          fi

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $CURRENT_VERSION"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          PATCH=$((PATCH + 1))

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="${TAG_PREFIX}${VERSION}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version:     $VERSION"
          echo "Tag:             $TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Determine image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPOSITORY="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"

          IMAGE="ghcr.io/${OWNER}/${REPOSITORY}/${{ matrix.service }}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          SERVICE="${{ matrix.service }}"

          docker build \
            --file "apps/${SERVICE}/Dockerfile" \
            --build-arg VERSION="${VERSION}" \
            --label "org.opencontainers.image.title=${SERVICE}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:dev" \
            .

      - name: Push DEV image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"

          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:dev"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            --annotate "$TAG" \
            --message "Build ${{ matrix.service }} ${VERSION}"

          git push origin "$TAG"

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true

  promote-qa:
    name: Promote ${{ matrix.service }} to QA

    needs:
      - detect

    if: |
      github.ref_name == 'qa' &&
      needs.detect.outputs.has_changes == 'true'

    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    concurrency:
      group: promote-${{ matrix.service }}-qa
      cancel-in-progress: false

    environment: QA

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine image
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPOSITORY="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"

          IMAGE="ghcr.io/${OWNER}/${REPOSITORY}/${{ matrix.service }}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Determine promoted version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ matrix.service }}"

          TAG="$(
            git tag \
              --merged HEAD \
              --list "${SERVICE}-v[0-9]*.[0-9]*.[0-9]*" \
              --sort=-version:refname \
            | head -n 1
          )"

          if [ -z "$TAG" ]; then
            echo "No release version found for ${SERVICE}"
            exit 1
          fi

          VERSION="${TAG#${SERVICE}-v}"

          echo "Promoting version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Promote image to QA
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"

          echo "Pulling immutable version:"
          echo "  ${IMAGE}:${VERSION}"

          docker pull "${IMAGE}:${VERSION}"

          SOURCE_DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "${IMAGE}:${VERSION}"
          )"

          echo "Source digest:"
          echo "  $SOURCE_DIGEST"

          docker tag \
            "${IMAGE}:${VERSION}" \
            "${IMAGE}:qa"

          docker push "${IMAGE}:qa"

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true

  promote-prod:
    name: Promote ${{ matrix.service }} to PROD

    needs:
      - detect

    if: |
      github.ref_name == 'main' &&
      needs.detect.outputs.has_changes == 'true'

    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    concurrency:
      group: promote-${{ matrix.service }}-prod
      cancel-in-progress: false

    environment: PROD

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine image
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPOSITORY="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"

          IMAGE="ghcr.io/${OWNER}/${REPOSITORY}/${{ matrix.service }}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Determine promoted version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="${{ matrix.service }}"

          TAG="$(
            git tag \
              --merged HEAD \
              --list "${SERVICE}-v[0-9]*.[0-9]*.[0-9]*" \
              --sort=-version:refname \
            | head -n 1
          )"

          if [ -z "$TAG" ]; then
            echo "No release version found for ${SERVICE}"
            exit 1
          fi

          VERSION="${TAG#${SERVICE}-v}"

          echo "Promoting version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Promote image to PROD
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"

          docker pull "${IMAGE}:${VERSION}"

          SOURCE_DIGEST="$(
            docker inspect \
              --format='{{index .RepoDigests 0}}' \
              "${IMAGE}:${VERSION}"
          )"

          echo "Promoting digest:"
          echo "  $SOURCE_DIGEST"

          docker tag \
            "${IMAGE}:${VERSION}" \
            "${IMAGE}:prod"

          docker tag \
            "${IMAGE}:${VERSION}" \
            "${IMAGE}:latest"

          docker push "${IMAGE}:prod"
          docker push "${IMAGE}:latest"

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
