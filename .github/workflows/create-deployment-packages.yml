name: Create Deployment Packages

# Consumes the output of the Service Version Build workflow.
#
# This workflow DOES NOT BUILD application code.
#
# Responsibilities:
#   - Download the exact release manifest produced by the build pipeline.
#   - Validate environment/version relationships.
#   - Generate an immutable deployment bundle.
#   - Store the deployment bundle in GitHub Releases.
#   - Gate publication through the appropriate GitHub Environment.
#
# Storage model:
#
#   dev  -> GitHub prerelease
#   qa   -> GitHub prerelease
#   main -> GitHub production release
#
# Deployment release tags are intentionally separate from service SemVer tags:
#
#   deployment/dev/<workflow-run-id>
#   deployment/qa/<workflow-run-id>
#   deployment/main/<workflow-run-id>
#
# This avoids conflicting with service tags such as:
#
#   my-service/v1.4.0-beta+1042
#   my-service/v1.4.0-rc+1087
#   my-service/v1.4.0
#
# Version model:
#
#   dev:
#     1.4.0-beta+1042
#
#   qa:
#     1.4.0-rc+1087
#
#   main / production:
#     1.4.0+1087
#
# Docker-safe image versions use "_" in place of "+":
#
#   1.4.0-beta_1042
#   1.4.0-rc_1087
#   1.4.0_1087

on:
  workflow_run:
    workflows:
      - Service Version Build
    types:
      - completed

  # Allows a particular successful build workflow run to be packaged manually.
  workflow_dispatch:
    inputs:
      run-id:
        description: "Service Version Build workflow run ID"
        required: true
        type: string

# GitHub Releases require contents: write.
permissions:
  actions: read
  contents: write

concurrency:
  group: promotion-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # RESOLVE SOURCE BUILD
  # ===========================================================================

  resolve:
    name: Resolve source build

    # Automatic promotion only runs when the source build succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: self-hosted

    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
      branch: ${{ steps.source.outputs.branch }}
      git-sha: ${{ steps.source.outputs.git-sha }}
      environment: ${{ steps.source.outputs.environment }}
      artifact-pattern: ${{ steps.source.outputs.artifact-pattern }}

    steps:
      - name: Resolve workflow run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs['run-id'] }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_ID="$DISPATCH_RUN_ID"

            RUN_JSON="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            )"

            BRANCH="$(jq -r '.head_branch' <<< "$RUN_JSON")"
            SHA="$(jq -r '.head_sha' <<< "$RUN_JSON")"
            CONCLUSION="$(jq -r '.conclusion' <<< "$RUN_JSON")"

            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::Source workflow run ${RUN_ID} was not successful."
              exit 1
            fi
          else
            RUN_ID="$WORKFLOW_RUN_ID"
            BRANCH="$WORKFLOW_BRANCH"
            SHA="$WORKFLOW_SHA"
          fi

          case "$BRANCH" in
            dev)
              ENVIRONMENT="development"
              ;;

            qa)
              ENVIRONMENT="qa"
              ;;

            main)
              ENVIRONMENT="production"
              ;;

            *)
              echo "::error::Branch '${BRANCH}' is not a promotable environment."
              exit 1
              ;;
          esac

          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "git-sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "artifact-pattern=release-manifest-${BRANCH}-*" >> "$GITHUB_OUTPUT"

          echo "Source workflow run: $RUN_ID"
          echo "Branch:              $BRANCH"
          echo "Environment:         $ENVIRONMENT"
          echo "Git SHA:             $SHA"

  # ===========================================================================
  # DOWNLOAD / VALIDATE RELEASE MANIFEST
  # ===========================================================================

  validate:
    name: Validate ${{ needs.resolve.outputs.environment }} release

    needs:
      - resolve

    runs-on: self-hosted

    outputs:
      deployment-version: ${{ steps.validate.outputs.deployment-version }}
      manifest-name: ${{ steps.validate.outputs.manifest-name }}
      service-count: ${{ steps.validate.outputs.service-count }}

    steps:
      - name: Download source release manifest
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.resolve.outputs.artifact-pattern }}
          path: ${{ runner.temp }}/source-manifest
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.run-id }}

      - name: Locate release manifest
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t MANIFESTS < <(
            find "${{ runner.temp }}/source-manifest" \
              -type f \
              -name '*.json' \
              -print
          )

          if [ "${#MANIFESTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release manifest; found ${#MANIFESTS[@]}."
            printf '%s\n' "${MANIFESTS[@]}"
            exit 1
          fi

          echo "manifest=${MANIFESTS[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate release manifest
        id: validate
        shell: bash
        env:
          MANIFEST: ${{ steps.locate.outputs.manifest }}
          EXPECTED_BRANCH: ${{ needs.resolve.outputs.branch }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.git-sha }}
        run: |
          set -euo pipefail

          echo "Validating:"
          jq . "$MANIFEST"

          # ---------------------------------------------------------------
          # Basic structure
          # ---------------------------------------------------------------

          jq -e '
            .schema_version == 1 and
            (.services | type == "array")
          ' "$MANIFEST" >/dev/null || {
            echo "::error::Unsupported or invalid release manifest."
            exit 1
          }

          # ---------------------------------------------------------------
          # Environment must match source branch
          # ---------------------------------------------------------------

          ACTUAL_ENVIRONMENT="$(jq -r '.environment' "$MANIFEST")"

          if [ "$ACTUAL_ENVIRONMENT" != "$EXPECTED_BRANCH" ]; then
            echo "::error::Manifest environment '${ACTUAL_ENVIRONMENT}' does not match '${EXPECTED_BRANCH}'."
            exit 1
          fi

          # ---------------------------------------------------------------
          # Manifest must correspond to the source workflow commit
          # ---------------------------------------------------------------

          ACTUAL_SHA="$(jq -r '.git_sha' "$MANIFEST")"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Manifest SHA does not match source workflow SHA."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

          # ---------------------------------------------------------------
          # Never promote incomplete manifests
          # ---------------------------------------------------------------

          INCOMPLETE="$(jq -r '.incomplete' "$MANIFEST")"

          if [ "$INCOMPLETE" = "true" ]; then
            echo "::error::Release manifest is incomplete."

            jq -r '
              .services[]
              | select(.image_ref == "")
              | "Missing artifact: \(.slug)"
            ' "$MANIFEST"

            exit 1
          fi

          # ---------------------------------------------------------------
          # Validate service version format
          # ---------------------------------------------------------------

          case "$EXPECTED_BRANCH" in
            dev)
              VERSION_REGEX='^[0-9]+\.[0-9]+\.[0-9]+-beta\+[0-9]+$'
              ;;

            qa)
              VERSION_REGEX='^[0-9]+\.[0-9]+\.[0-9]+-rc\+[0-9]+$'
              ;;

            main)
              VERSION_REGEX='^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'
              ;;
          esac

          INVALID="$(
            jq -r \
              --arg regex "$VERSION_REGEX" \
              '.services[]
               | select((.version | test($regex)) | not)
               | "\(.slug)=\(.version)"' \
              "$MANIFEST"
          )"

          if [ -n "$INVALID" ]; then
            echo "::error::One or more service versions are invalid for '${EXPECTED_BRANCH}':"
            echo "$INVALID"
            exit 1
          fi

          # ---------------------------------------------------------------
          # Every service must have a deployable image reference.
          # ---------------------------------------------------------------

          MISSING_IMAGES="$(
            jq -r '
              .services[]
              | select(
                  (.image_ref == null) or
                  (.image_ref == "")
                )
              | .slug
            ' "$MANIFEST"
          )"

          if [ -n "$MISSING_IMAGES" ]; then
            echo "::error::Services have no deployable image reference:"
            echo "$MISSING_IMAGES"
            exit 1
          fi

          # ---------------------------------------------------------------
          # Deployment bundle identity.
          #
          # This is NOT an application SemVer.
          # ---------------------------------------------------------------

          RUN_NUMBER="$(jq -r '.run_number' "$MANIFEST")"
          DEPLOYMENT_VERSION="${EXPECTED_BRANCH}-${RUN_NUMBER}"

          echo "deployment-version=$DEPLOYMENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "manifest-name=$(basename "$MANIFEST")" >> "$GITHUB_OUTPUT"
          echo "service-count=$(jq '.services | length' "$MANIFEST")" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # CREATE DEPLOYMENT PACKAGE + DRAFT GITHUB RELEASE
  # ===========================================================================

  package:
    name: Package ${{ needs.resolve.outputs.environment }} deployable

    needs:
      - resolve
      - validate

    runs-on: self-hosted

    outputs:
      release-tag: ${{ steps.package.outputs.release-tag }}
      release-name: ${{ steps.package.outputs.release-name }}

    steps:
      - name: Download source release manifest
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.resolve.outputs.artifact-pattern }}
          path: ${{ runner.temp }}/source-manifest
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.run-id }}

      - name: Create deployment bundle
        id: package
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.branch }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.run-id }}
          SOURCE_SHA: ${{ needs.resolve.outputs.git-sha }}
          DEPLOYMENT_VERSION: ${{ needs.validate.outputs.deployment-version }}
        run: |
          set -euo pipefail

          SOURCE_MANIFEST="$(
            find "${{ runner.temp }}/source-manifest" \
              -type f \
              -name '*.json' \
              -print \
              -quit
          )"

          BUNDLE_ROOT="${{ runner.temp }}/deployable"
          CONTENT_DIR="${BUNDLE_ROOT}/${DEPLOYMENT_VERSION}"

          mkdir -p "$CONTENT_DIR"

          # ---------------------------------------------------------------
          # Canonical release manifest
          # ---------------------------------------------------------------

          cp "$SOURCE_MANIFEST" \
             "$CONTENT_DIR/release-manifest.json"

          # ---------------------------------------------------------------
          # Environment-variable representation
          # ---------------------------------------------------------------

          jq -r '
            .services[]
            | (
                (.slug
                  | ascii_upcase
                  | gsub("[^A-Z0-9]"; "_")
                )
                + "_IMAGE="
                + .image_ref
              )
          ' "$SOURCE_MANIFEST" \
            > "$CONTENT_DIR/images.env"

          # ---------------------------------------------------------------
          # Generic deployment image map
          # ---------------------------------------------------------------

          jq '
            {
              environment: .environment,
              git_sha: .git_sha,
              services:
                (
                  .services
                  | map({
                      key: .slug,
                      value: {
                        version: .version,
                        image: .image_ref,
                        git_tag: .git_tag
                      }
                    })
                  | from_entries
                )
            }
          ' "$SOURCE_MANIFEST" \
            > "$CONTENT_DIR/images.json"

          # ---------------------------------------------------------------
          # Promotion metadata
          # ---------------------------------------------------------------

          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg deployment_version "$DEPLOYMENT_VERSION" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              environment: $environment,
              deployment_version: $deployment_version,
              source_branch: $source_branch,
              source_git_sha: $source_sha,
              source_workflow_run_id: $source_run_id,
              created_at: $created_at
            }' \
            > "$CONTENT_DIR/promotion.json"

          # ---------------------------------------------------------------
          # Internal file checksums
          # ---------------------------------------------------------------

          (
            cd "$CONTENT_DIR"

            sha256sum \
              release-manifest.json \
              images.env \
              images.json \
              promotion.json \
              > SHA256SUMS
          )

          # ---------------------------------------------------------------
          # Produce deployment archive formats
          # ---------------------------------------------------------------

          ZIP_FILE="${BUNDLE_ROOT}/${DEPLOYMENT_VERSION}.zip"
          TAR_FILE="${BUNDLE_ROOT}/${DEPLOYMENT_VERSION}.tar.gz"

          (
            cd "$BUNDLE_ROOT"

            zip -qr \
              "$(basename "$ZIP_FILE")" \
              "$DEPLOYMENT_VERSION"

            tar -czf \
              "$(basename "$TAR_FILE")" \
              "$DEPLOYMENT_VERSION"
          )

          # ---------------------------------------------------------------
          # Release asset checksums
          # ---------------------------------------------------------------

          (
            cd "$BUNDLE_ROOT"

            sha256sum \
              "$(basename "$ZIP_FILE")" \
              "$(basename "$TAR_FILE")" \
              > SHA256SUMS
          )

          # Also expose the source manifest directly as a release asset.
          cp "$SOURCE_MANIFEST" \
             "$BUNDLE_ROOT/release-manifest.json"

          RELEASE_TAG="deployment/${SOURCE_BRANCH}/${SOURCE_RUN_ID}"
          RELEASE_NAME="Deployment ${ENVIRONMENT} - ${DEPLOYMENT_VERSION}"

          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release-name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          echo
          echo "Deployment bundle:"
          find "$BUNDLE_ROOT" -maxdepth 2 -type f -print

      # -----------------------------------------------------------------------
      # Create release notes
      # -----------------------------------------------------------------------

      - name: Create release notes
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.package.outputs.release-name }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.branch }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.run-id }}
          SOURCE_SHA: ${{ needs.resolve.outputs.git-sha }}
          DEPLOYMENT_VERSION: ${{ needs.validate.outputs.deployment-version }}
          SERVICE_COUNT: ${{ needs.validate.outputs.service-count }}
        run: |
          set -euo pipefail

          NOTES_FILE="${{ runner.temp }}/release-notes.md"

          cat > "$NOTES_FILE" <<EOF
          ## ${RELEASE_NAME}

          This release contains the deployment package generated from an
          existing successful Service Version Build workflow.

          **No application code was rebuilt by this promotion workflow.**

          | Property | Value |
          |---|---|
          | Environment | \`${ENVIRONMENT}\` |
          | Deployment version | \`${DEPLOYMENT_VERSION}\` |
          | Source branch | \`${SOURCE_BRANCH}\` |
          | Source workflow run | \`${SOURCE_RUN_ID}\` |
          | Source Git SHA | \`${SOURCE_SHA}\` |
          | Services | \`${SERVICE_COUNT}\` |

          ### Assets

          - \`${DEPLOYMENT_VERSION}.zip\`
          - \`${DEPLOYMENT_VERSION}.tar.gz\`
          - \`release-manifest.json\`
          - \`SHA256SUMS\`

          The release manifest is the authoritative list of service versions
          and container image references represented by this deployment.
          EOF

      # -----------------------------------------------------------------------
      # Store package in a DRAFT GitHub Release.
      #
      # The release is deliberately left as a draft here.
      #
      # It will only become visible/published after the GitHub Environment
      # approval in the "promote" job.
      # -----------------------------------------------------------------------

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release-tag }}
          RELEASE_NAME: ${{ steps.package.outputs.release-name }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.branch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.git-sha }}
          DEPLOYMENT_VERSION: ${{ needs.validate.outputs.deployment-version }}
        run: |
          set -euo pipefail

          BUNDLE_ROOT="${{ runner.temp }}/deployable"
          NOTES_FILE="${{ runner.temp }}/release-notes.md"

          ZIP_FILE="${BUNDLE_ROOT}/${DEPLOYMENT_VERSION}.zip"
          TAR_FILE="${BUNDLE_ROOT}/${DEPLOYMENT_VERSION}.tar.gz"
          MANIFEST_FILE="${BUNDLE_ROOT}/release-manifest.json"
          CHECKSUM_FILE="${BUNDLE_ROOT}/SHA256SUMS"

          # ---------------------------------------------------------------
          # Protect already-published releases.
          #
          # A published deployment release is treated as immutable by this
          # workflow even if repository-level immutable releases are disabled.
          # ---------------------------------------------------------------

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            IS_DRAFT="$(
              gh release view "$RELEASE_TAG" \
                --json isDraft \
                --jq '.isDraft'
            )"

            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Deployment release already exists and is published:"
              echo "  $RELEASE_TAG"
              echo
              echo "Published deployment releases are never overwritten."
              exit 1
            fi

            echo "Existing draft release found."
            echo "Refreshing draft assets."

            gh release upload "$RELEASE_TAG" \
              "$ZIP_FILE" \
              "$TAR_FILE" \
              "$MANIFEST_FILE" \
              "$CHECKSUM_FILE" \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file "$NOTES_FILE"

          else

            RELEASE_ARGS=(
              "$RELEASE_TAG"
              "$ZIP_FILE"
              "$TAR_FILE"
              "$MANIFEST_FILE"
              "$CHECKSUM_FILE"
              --draft
              --target "$SOURCE_SHA"
              --title "$RELEASE_NAME"
              --notes-file "$NOTES_FILE"
              --latest=false
            )

            # Dev and QA packages are GitHub prereleases.
            #
            # Production is a normal release.
            if [ "$SOURCE_BRANCH" != "main" ]; then
              RELEASE_ARGS+=(--prerelease)
            fi

            gh release create "${RELEASE_ARGS[@]}"
          fi

          echo
          echo "Draft release:"
          gh release view "$RELEASE_TAG" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,url

  # ===========================================================================
  # DEPLOYMENT ENVIRONMENT GATE + RELEASE PUBLICATION
  # ===========================================================================

  promote:
    name: Promote to ${{ needs.resolve.outputs.environment }}

    needs:
      - resolve
      - validate
      - package

    runs-on: self-hosted

    # -------------------------------------------------------------------------
    # Configure these GitHub environments:
    #
    #   development
    #   qa
    #   production
    #
    # Recommended:
    #
    # development:
    #   no approval required
    #
    # qa:
    #   optional QA approval
    #
    # production:
    #   required reviewers
    #   prevent self-review
    #   restrict deployment branches to main
    #
    # The draft GitHub Release will not be published until this environment
    # gate has been satisfied.
    # -------------------------------------------------------------------------

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false

    outputs:
      release-url: ${{ steps.publish.outputs.release-url }}

    steps:
      # -----------------------------------------------------------------------
      # Verify release before publication
      # -----------------------------------------------------------------------

      - name: Verify draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release-tag }}
          DEPLOYMENT_VERSION: ${{ needs.validate.outputs.deployment-version }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            gh release view "$RELEASE_TAG" \
              --json tagName,name,isDraft,isPrerelease,targetCommitish,assets,url
          )"

          echo "$RELEASE_JSON" | jq .

          IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_JSON")"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Expected deployment release to still be a draft."
            exit 1
          fi

          REQUIRED_ASSETS=(
            "${DEPLOYMENT_VERSION}.zip"
            "${DEPLOYMENT_VERSION}.tar.gz"
            "release-manifest.json"
            "SHA256SUMS"
          )

          for ASSET in "${REQUIRED_ASSETS[@]}"; do
            EXISTS="$(
              jq \
                --arg asset "$ASSET" \
                '[.assets[] | select(.name == $asset)] | length' \
                <<< "$RELEASE_JSON"
            )"

            if [ "$EXISTS" -ne 1 ]; then
              echo "::error::Required release asset is missing: ${ASSET}"
              exit 1
            fi
          done

          echo
          echo "Draft release passed validation."

      # -----------------------------------------------------------------------
      # Publish release
      #
      # If repository-level immutable releases are enabled, GitHub will make
      # the release tag/assets immutable at publication time.
      # -----------------------------------------------------------------------

      - name: Publish GitHub Release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release-tag }}
        run: |
          set -euo pipefail

          echo "Publishing deployment release:"
          echo "  $RELEASE_TAG"

          gh release edit "$RELEASE_TAG" \
            --draft=false

          RELEASE_URL="$(
            gh release view "$RELEASE_TAG" \
              --json url \
              --jq '.url'
          )"

          echo "release-url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

          echo
          echo "Published:"
          echo "  $RELEASE_URL"

      # -----------------------------------------------------------------------
      # Verify published state
      # -----------------------------------------------------------------------

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release-tag }}
        run: |
          set -euo pipefail

          IS_DRAFT="$(
            gh release view "$RELEASE_TAG" \
              --json isDraft \
              --jq '.isDraft'
          )"

          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::Release is still a draft after publication."
            exit 1
          fi

          echo "Deployment release successfully published."

  # ===========================================================================
  # SUMMARY
  # ===========================================================================

  summary:
    name: Promotion summary

    needs:
      - resolve
      - validate
      - package
      - promote

    if: always() && needs.promote.result == 'success'

    runs-on: self-hosted

    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "## 🚀 Deployment Promotion"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Environment | \`${{ needs.resolve.outputs.environment }}\` |"
            echo "| Source branch | \`${{ needs.resolve.outputs.branch }}\` |"
            echo "| Source workflow run | \`${{ needs.resolve.outputs.run-id }}\` |"
            echo "| Git SHA | \`${{ needs.resolve.outputs.git-sha }}\` |"
            echo "| Service count | \`${{ needs.validate.outputs.service-count }}\` |"
            echo "| Deployment version | \`${{ needs.validate.outputs.deployment-version }}\` |"
            echo "| GitHub Release tag | \`${{ needs.package.outputs.release-tag }}\` |"
            echo "| GitHub Release | ${{ needs.promote.outputs.release-url }} |"
            echo
            echo "### Release assets"
            echo
            echo "- \`${{ needs.validate.outputs.deployment-version }}.zip\`"
            echo "- \`${{ needs.validate.outputs.deployment-version }}.tar.gz\`"
            echo "- \`release-manifest.json\`"
            echo "- \`SHA256SUMS\`"
            echo
            echo "The deployment package is stored permanently as a GitHub Release rather than a temporary GitHub Actions artifact."
          } >> "$GITHUB_STEP_SUMMARY"
