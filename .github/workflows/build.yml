name: Service Version Build

on:
  push:
    branches:
      - dev
      - qa
      - main

  workflow_dispatch:
    inputs:
      bump-override:
        description: "Force .NET bump type"
        type: choice
        default: Auto
        options:
          - Auto
          - Major
          - Minor
          - Patch

      services:
        description: "Comma-separated service slugs to force-build"
        type: string
        required: false
        default: ""

      first-release:
        description: "Treat Node projects as their first Nx release"
        type: boolean
        required: false
        default: false

      validation-only:
        description: "Validate workflow without committing, tagging, building, or pushing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: service-version-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NX_DAEMON: "false"
  VERSION_SCRIPT: .github/scripts/versioning/version.ps1
  NUGET_SOURCE_NAME: github
  NUGET_SOURCE_URL: ""

defaults:
  run:
    shell: bash

jobs:
  # ===========================================================================
  # DISCOVERY
  # ===========================================================================

  discover:
    name: Discover services
    runs-on: self-hosted

    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-services: ${{ steps.discover.outputs.has-services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Discover services
        id: discover
        run: |
          set -euo pipefail

          if [ ! -f service-catalog.json ]; then
            echo "::error::service-catalog.json does not exist."
            exit 1
          fi

          MATRIX="$(jq -c '.services' service-catalog.json)"
          COUNT="$(jq '.services | length' service-catalog.json)"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "has-services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-services=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Discovery summary
        run: |
          {
            echo "## Service Discovery"
            echo

            if [ "${{ steps.discover.outputs.has-services }}" = "true" ]; then
              echo "| Service | Slug | Type | Path | Dockerfile |"
              echo "|---|---|---|---|---|"

              jq -r \
                '.services[] |
                 "| `\(.name)` | `\(.slug)` | `\(.type)` | `\(.path)` | `\(.dockerfile)` |"' \
                service-catalog.json
            else
              echo "No services discovered."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # NX NODE RELEASE
  # ===========================================================================

  release:
    name: Release Node projects
    needs:
      - discover

    if: needs.discover.outputs.has-services == 'true'

    runs-on: self-hosted

    outputs:
      sha: ${{ steps.release-sha.outputs.sha }}
      released-projects: ${{ steps.released-projects.outputs.projects }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refresh tags
        run: git fetch --tags --force

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture existing tags
        run: |
          git tag | sort > "${{ runner.temp }}/tags-before.txt"

      - name: Release Node projects
        if: inputs.validation-only != true
        env:
          BRANCH: ${{ github.ref_name }}
          FIRST_RELEASE: ${{ inputs.first-release || false }}
        run: |
          set -euo pipefail

          NODE_PROJECTS="$(
            jq -r \
              '.services[]
               | select(.type == "node")
               | .name' \
              service-catalog.json |
            paste -sd ',' -
          )"

          if [ -z "$NODE_PROJECTS" ]; then
            echo "No Node projects configured."
            exit 0
          fi

          ARGS=(
            --skip-publish
            --projects="$NODE_PROJECTS"
          )

          if [ "$FIRST_RELEASE" = "true" ]; then
            ARGS+=(--first-release)
          fi

          case "$BRANCH" in
            dev)
              ARGS+=(--preid=beta)
              ;;

            qa)
              ARGS+=(--preid=rc)
              ;;

            main)
              ;;

            *)
              echo "::error::Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

          echo "Running:"
          printf 'pnpm nx release'
          printf ' %q' "${ARGS[@]}"
          echo

          pnpm nx release "${ARGS[@]}"

      - name: Validate Node release
        if: inputs.validation-only == true
        env:
          BRANCH: ${{ github.ref_name }}
          FIRST_RELEASE: ${{ inputs.first-release || false }}
        run: |
          set -euo pipefail

          NODE_PROJECTS="$(
            jq -r \
              '.services[]
               | select(.type == "node")
               | .name' \
              service-catalog.json |
            paste -sd ',' -
          )"

          if [ -z "$NODE_PROJECTS" ]; then
            exit 0
          fi

          ARGS=(
            --dry-run
            --skip-publish
            --projects="$NODE_PROJECTS"
          )

          if [ "$FIRST_RELEASE" = "true" ]; then
            ARGS+=(--first-release)
          fi

          case "$BRANCH" in
            dev)
              ARGS+=(--preid=beta)
              ;;

            qa)
              ARGS+=(--preid=rc)
              ;;

            main)
              ;;

            *)
              echo "::error::Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

          pnpm nx release "${ARGS[@]}"

      - name: Push release commit and tags
        if: inputs.validation-only != true
        run: |
          set -euo pipefail

          git push origin "HEAD:${GITHUB_REF_NAME}"

          git tag |
            sort |
            comm -13 \
              "${{ runner.temp }}/tags-before.txt" \
              - |
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue

              echo "Pushing tag: $tag"
              git push origin "refs/tags/$tag"
            done

      - name: Determine released Node projects
        id: released-projects
        run: |
          set -euo pipefail

          PROJECTS='[]'

          while IFS= read -r project; do
            [ -n "$project" ] || continue

            if git tag \
              --points-at HEAD \
              --list "${project}@*" |
              grep -q .
            then
              PROJECTS="$(
                jq \
                  --arg project "$project" \
                  '. + [$project] | unique' \
                  <<< "$PROJECTS"
              )"
            fi
          done < <(
            jq -r \
              '.services[]
               | select(.type == "node")
               | .name' \
              service-catalog.json
          )

          PROJECTS="$(jq -c . <<< "$PROJECTS")"

          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "Released projects: $PROJECTS"

      - name: Capture release SHA
        id: release-sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # BUILD
  # ===========================================================================

  build:
    name: Build (${{ matrix.service.slug }})

    needs:
      - discover
      - release

    if: needs.discover.outputs.has-services == 'true'

    runs-on: self-hosted

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Refresh tags
        run: git fetch --tags --force

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.service.dotnet_version || '10.0.x' }}

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.service.node_version || '24' }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # AFFECTED DETECTION
      # -----------------------------------------------------------------------

      - name: Determine whether service is affected
        id: affected
        env:
          PROJECT_NAME: ${{ matrix.service.name }}
          SERVICE_SLUG: ${{ matrix.service.slug }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
          FORCED_SERVICES: ${{ inputs.services || '' }}
        run: |
          set -euo pipefail

          affected=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            IFS=',' read -ra SERVICES <<< "$FORCED_SERVICES"

            for service in "${SERVICES[@]}"; do
              service="$(echo "$service" | xargs)"

              if [ -n "$service" ] && [ "$service" = "$SERVICE_SLUG" ]; then
                affected=true
                break
              fi
            done
          fi

          if [ "$affected" != "true" ] && [ "$EVENT_NAME" = "push" ]; then
            BASE="$EVENT_BEFORE"

            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
              BASE="$(git rev-list --max-parents=0 "$EVENT_HEAD" | tail -1)"
            fi

            AFFECTED_PROJECTS="$(
              pnpm nx show projects \
                --affected \
                --base="$BASE" \
                --head="$EVENT_HEAD"
            )"

            echo "Affected Nx projects:"
            echo "$AFFECTED_PROJECTS"

            if grep -Fxq "$PROJECT_NAME" <<< "$AFFECTED_PROJECTS"; then
              affected=true
            fi
          fi

          echo "affected=$affected" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # CORE VERSION
      # -----------------------------------------------------------------------

      - name: Read Node core version
        id: node-version
        if: matrix.service.type == 'node'
        env:
          PROJECT_PATH: ${{ matrix.service.path }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(
            node -p \
              "require('./${PROJECT_PATH}/package.json').version"
          )"

          CORE_VERSION="${PACKAGE_VERSION%%+*}"
          CORE_VERSION="${CORE_VERSION%%-*}"

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute .NET core version
        id: dotnet-version
        if: matrix.service.type == 'dotnet'
        env:
          SLUG: ${{ matrix.service.slug }}
        run: |
          set -euo pipefail

          ARGS=(
            plan
            --slug "$SLUG"
            --branch "${{ github.ref_name }}"
            --bump "${{ inputs.bump-override || 'Auto' }}"
            --buildnum "${{ github.run_number }}"
          )

          if [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(
              --since
              "${{ github.event.before }}"
            )
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IFS=',' read -ra WANTED <<< "${{ inputs.services }}"

            for service in "${WANTED[@]}"; do
              service="$(echo "$service" | xargs)"

              if [ -n "$service" ] && [ "$service" = "$SLUG" ]; then
                ARGS+=(--force)
                break
              fi
            done
          fi

          PLAN="$(
            pwsh \
              -NoProfile \
              -File "$VERSION_SCRIPT" \
              "${ARGS[@]}"
          )"

          echo "$PLAN"

          CORE_VERSION="$(
            grep '^core_version=' <<< "$PLAN" |
            tail -1 |
            cut -d= -f2-
          )"

          if [ -z "$CORE_VERSION" ]; then
            echo "::error::Could not determine .NET core version."
            exit 1
          fi

          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # ENVIRONMENT VERSION
      # -----------------------------------------------------------------------

      - name: Generate artifact version
        id: version
        env:
          SERVICE_TYPE: ${{ matrix.service.type }}
          SERVICE_SLUG: ${{ matrix.service.slug }}
          NODE_CORE_VERSION: ${{ steps.node-version.outputs.core_version }}
          DOTNET_CORE_VERSION: ${{ steps.dotnet-version.outputs.core_version }}
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ "$SERVICE_TYPE" = "node" ]; then
            CORE_VERSION="$NODE_CORE_VERSION"
          else
            CORE_VERSION="$DOTNET_CORE_VERSION"
          fi

          if [ -z "$CORE_VERSION" ]; then
            echo "::error::Core version was not resolved."
            exit 1
          fi

          BUILD="$(printf '%03d' "$BUILD_NUMBER")"

          case "$BRANCH" in
            dev)
              VERSION="${CORE_VERSION}-beta+${BUILD}"
              ;;

            qa)
              VERSION="${CORE_VERSION}-rc+${BUILD}"
              ;;

            main)
              VERSION="${CORE_VERSION}+${BUILD}"
              ;;

            *)
              echo "::error::Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

          IMAGE_VERSION="${VERSION//+/-}"
          BUILD_TAG="${SERVICE_SLUG}/v${VERSION}"

          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"

          echo "Core version:     $CORE_VERSION"
          echo "Artifact version: $VERSION"
          echo "Docker version:   $IMAGE_VERSION"
          echo "Build tag:        $BUILD_TAG"

      # -----------------------------------------------------------------------
      # NUGET
      # -----------------------------------------------------------------------

      - name: Configure GitHub NuGet source
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true &&
          matrix.service.type == 'dotnet' &&
          env.NUGET_SOURCE_URL != ''
        run: |
          dotnet nuget remove source "$NUGET_SOURCE_NAME" \
            >/dev/null 2>&1 || true

          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name "$NUGET_SOURCE_NAME" \
            "$NUGET_SOURCE_URL"

      # -----------------------------------------------------------------------
      # DOTNET BUILD
      # -----------------------------------------------------------------------

      - name: Restore .NET app
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true &&
          matrix.service.type == 'dotnet'
        run: |
          pnpm nx run "${{ matrix.service.name }}:restore"

      - name: Build .NET app
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true &&
          matrix.service.type == 'dotnet'
        run: |
          pnpm nx run "${{ matrix.service.name }}:build:release"

      - name: Test .NET app
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true &&
          matrix.service.type == 'dotnet'
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
        run: |
          set -euo pipefail

          mapfile -t TEST_PROJECTS < <(
            find . \
              -type f \
              \( \
                -name "${SERVICE_NAME}.Tests.csproj" \
                -o -name "${SERVICE_NAME}.Test.csproj" \
                -o -name "*${SERVICE_NAME}*Tests.csproj" \
                -o -name "*${SERVICE_NAME}*Test.csproj" \
              \) \
              -print |
            sort
          )

          if [ "${#TEST_PROJECTS[@]}" -eq 0 ]; then
            echo "No test projects found for ${SERVICE_NAME}."
            exit 0
          fi

          for project in "${TEST_PROJECTS[@]}"; do
            dotnet test \
              "$project" \
              --configuration Release
          done

      # -----------------------------------------------------------------------
      # NODE BUILD
      # -----------------------------------------------------------------------

      - name: Build Node app
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true &&
          matrix.service.type == 'node'
        run: |
          pnpm nx run "${{ matrix.service.name }}:build"

      - name: Test Node app
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true &&
          matrix.service.type == 'node' &&
          matrix.service.test_command != ''
        working-directory: ${{ matrix.service.path }}
        run: |
          ${{ matrix.service.test_command }}

      # -----------------------------------------------------------------------
      # VALIDATION
      # -----------------------------------------------------------------------

      - name: Validate build inputs
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only == true
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          GHCR_IMAGE="ghcr.io/${GHCR_REPOSITORY,,}/${{ matrix.service.slug }}"

          echo "Type:            ${{ matrix.service.type }}"
          echo "Path:            ${{ matrix.service.path }}"
          echo "Dockerfile:      ${{ matrix.service.dockerfile }}"
          echo "Artifact version:${{ steps.version.outputs.version }}"
          echo "Image:           ${GHCR_IMAGE}:${{ steps.version.outputs.image_version }}"

          test -d "${{ matrix.service.path }}"
          test -f "${{ matrix.service.dockerfile }}"

          if [ "${{ matrix.service.type }}" = "dotnet" ]; then
            test -f "${{ matrix.service.project }}"
          fi

      # -----------------------------------------------------------------------
      # DOCKER
      # -----------------------------------------------------------------------

      - name: Docker build
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          GHCR_IMAGE="ghcr.io/${GHCR_REPOSITORY,,}/${{ matrix.service.slug }}"

          DOCKER_ARGS=()

          if [ "${{ matrix.service.type }}" = "dotnet" ]; then
            DOCKER_ARGS+=(
              --build-arg "NUGET_URL=${NUGET_SOURCE_URL}"
              --build-arg "NUGET_USERNAME=${{ github.actor }}"
              --build-arg "NUGET_PASSWORD=${{ secrets.GITHUB_TOKEN }}"
            )
          fi

          docker build \
            "${DOCKER_ARGS[@]}" \
            -f "${{ matrix.service.dockerfile }}" \
            -t "${GHCR_IMAGE}:${{ steps.version.outputs.image_version }}" \
            "${{ matrix.service.docker_context }}"

      - name: Log in to GHCR
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: >
          steps.affected.outputs.affected == 'true' &&
          inputs.validation-only != true
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
        run: |
          GHCR_IMAGE="ghcr.io/${GHCR_REPOSITORY,,}/${{ matrix.service.slug }}"

          docker push \
            "${GHCR_IMAGE}:${{ steps.version.outputs.image_version }}"

      # -----------------------------------------------------------------------
      # SAVE BUILD PLAN
      # -----------------------------------------------------------------------

      - name: Save build plan
        run: |
          PLAN_DIR="${{ runner.temp }}/build-plans"
          PLAN_FILE="$PLAN_DIR/${{ matrix.service.slug }}.env"

          mkdir -p "$PLAN_DIR"

          {
            echo "affected=${{ steps.affected.outputs.affected }}"
            echo "core_version=${{ steps.version.outputs.core_version }}"
            echo "version=${{ steps.version.outputs.version }}"
            echo "image_version=${{ steps.version.outputs.image_version }}"
            echo "build_tag=${{ steps.version.outputs.build_tag }}"
          } > "$PLAN_FILE"

      - name: Upload build plan
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ matrix.service.slug }}
          path: ${{ runner.temp }}/build-plans/${{ matrix.service.slug }}.env
          retention-days: 1

      - name: Build summary
        run: |
          {
            echo "### ${{ matrix.service.name }}"
            echo
            echo "- **Affected:** \`${{ steps.affected.outputs.affected }}\`"
            echo "- **Core version:** \`${{ steps.version.outputs.core_version }}\`"
            echo "- **Artifact version:** \`${{ steps.version.outputs.version }}\`"
            echo "- **Docker version:** \`${{ steps.version.outputs.image_version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # ARTIFACT TAGS
  # ===========================================================================

  publish:
    name: Publish artifact tag (${{ matrix.service.slug }})

    needs:
      - discover
      - release
      - build

    if: needs.discover.outputs.has-services == 'true'

    runs-on: self-hosted

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Refresh tags
        run: git fetch --tags --force

      - name: Download build plan
        uses: actions/download-artifact@v7
        with:
          name: plan-${{ matrix.service.slug }}
          path: ${{ runner.temp }}/build-plans

      - name: Load build plan
        id: plan
        run: |
          PLAN_FILE="${{ runner.temp }}/build-plans/${{ matrix.service.slug }}.env"

          test -f "$PLAN_FILE"

          cat "$PLAN_FILE" >> "$GITHUB_OUTPUT"

      - name: Tag successful artifact
        if: >
          steps.plan.outputs.affected == 'true' &&
          inputs.validation-only != true
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BUILD_TAG="${{ steps.plan.outputs.build_tag }}"

          if git rev-parse "$BUILD_TAG" >/dev/null 2>&1; then
            echo "::error::Build tag already exists: $BUILD_TAG"
            exit 1
          fi

          git tag "$BUILD_TAG"
          git push origin "$BUILD_TAG"

          if \
            [ "${{ matrix.service.type }}" = "dotnet" ] &&
            [ "${{ github.ref_name }}" = "main" ]
          then
            RELEASE_TAG="${{ matrix.service.name }}@${{ steps.plan.outputs.core_version }}"

            if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
              git tag "$RELEASE_TAG"
              git push origin "$RELEASE_TAG"
            fi
          fi

      - name: Publish summary
        run: |
          {
            echo "### ${{ matrix.service.name }}"
            echo

            if [ "${{ steps.plan.outputs.affected }}" = "true" ]; then
              echo "- **Artifact version:** \`${{ steps.plan.outputs.version }}\`"
              echo "- **Build tag:** \`${{ steps.plan.outputs.build_tag }}\`"
            else
              echo "- **Status:** No artifact published"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # RELEASE MANIFEST
  # ===========================================================================

  manifest:
    name: Create environment manifest

    needs:
      - discover
      - release
      - publish

    if: needs.discover.outputs.has-services == 'true'

    runs-on: self-hosted

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Refresh tags
        run: git fetch --tags --force

      - name: Download build plans
        uses: actions/download-artifact@v7
        with:
          pattern: plan-*
          path: ${{ runner.temp }}/build-plans
          merge-multiple: true

      - name: Create manifest
        id: manifest
        env:
          SERVICE_MATRIX: ${{ needs.discover.outputs.matrix }}
          ENVIRONMENT_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ needs.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_ONLY: ${{ inputs.validation-only || false }}
        run: |
          set -euo pipefail

          MANIFEST_DIR="${{ runner.temp }}/release-manifest"
          MANIFEST_FILE="$MANIFEST_DIR/${ENVIRONMENT_NAME}-release-${RUN_NUMBER}.json"

          mkdir -p "$MANIFEST_DIR"

          REPOSITORY_LOWER="${REPOSITORY,,}"
          SERVICES_JSON='[]'

          while IFS= read -r service; do
            slug="$(jq -r '.slug' <<< "$service")"
            name="$(jq -r '.name' <<< "$service")"
            type="$(jq -r '.type' <<< "$service")"
            path="$(jq -r '.path' <<< "$service")"
            dockerfile="$(jq -r '.dockerfile' <<< "$service")"

            PLAN_FILE="${{ runner.temp }}/build-plans/${slug}.env"

            affected=false
            version=""
            image_version=""
            git_tag=""
            source=""

            if [ -f "$PLAN_FILE" ]; then
              source "$PLAN_FILE"

              if [ "$affected" = "true" ]; then
                if [ "$VALIDATION_ONLY" = "true" ]; then
                  source="validation-only"
                  git_tag=""
                else
                  source="current-run"
                  git_tag="$build_tag"
                fi
              fi
            fi

            if [ "$affected" != "true" ]; then
              source="existing-tag"

              case "$ENVIRONMENT_NAME" in
                dev)
                  git_tag="$(
                    git tag \
                      --list "${slug}/v*-beta+*" \
                      --sort=-v:refname |
                    head -1 ||
                    true
                  )"
                  ;;

                qa)
                  git_tag="$(
                    git tag \
                      --list "${slug}/v*-rc+*" \
                      --sort=-v:refname |
                    head -1 ||
                    true
                  )"
                  ;;

                main)
                  git_tag="$(
                    git tag \
                      --list "${slug}/v*+*" \
                      --sort=-v:refname |
                    grep -Ev -- '-(beta|rc)' |
                    head -1 ||
                    true
                  )"
                  ;;
              esac

              if [ -n "$git_tag" ]; then
                version="${git_tag#${slug}/v}"
                image_version="${version//+/-}"
              else
                source="missing"
                version=""
                image_version=""
              fi
            fi

            image="ghcr.io/${REPOSITORY_LOWER}/${slug}"

            note=""

            if [ "$source" = "missing" ]; then
              note="No image exists for this environment."
            fi

            SERVICES_JSON="$(
              jq \
                --arg slug "$slug" \
                --arg name "$name" \
                --arg type "$type" \
                --arg path "$path" \
                --arg dockerfile "$dockerfile" \
                --arg image "$image" \
                --arg version "$version" \
                --arg image_version "$image_version" \
                --arg git_tag "$git_tag" \
                --arg source "$source" \
                --arg affected "$affected" \
                --arg note "$note" \
                '
                . + [{
                  slug: $slug,
                  name: $name,
                  type: $type,
                  path: $path,
                  dockerfile: $dockerfile,
                  image: $image,
                  version: $version,
                  image_version: $image_version,
                  image_ref:
                    (
                      if $image_version == ""
                      then ""
                      else ($image + ":" + $image_version)
                      end
                    ),
                  git_tag: $git_tag,
                  source: $source,
                  affected: ($affected == "true"),
                  note: $note
                }]
                ' \
                <<< "$SERVICES_JSON"
            )"
          done < <(
            jq -c '.[]' <<< "$SERVICE_MATRIX"
          )

          MISSING_COUNT="$(
            jq \
              '[.[] | select(.source == "missing")] | length' \
              <<< "$SERVICES_JSON"
          )"

          INCOMPLETE=false

          if [ "$MISSING_COUNT" -gt 0 ]; then
            INCOMPLETE=true
          fi

          jq -n \
            --arg environment "$ENVIRONMENT_NAME" \
            --arg repository "$REPOSITORY" \
            --arg git_sha "$GIT_SHA" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_number "$RUN_NUMBER" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg validation_only "$VALIDATION_ONLY" \
            --arg incomplete "$INCOMPLETE" \
            --argjson services "$SERVICES_JSON" \
            '{
              schema_version: 1,
              environment: $environment,
              repository: $repository,
              git_sha: $git_sha,
              run_id: $run_id,
              run_number: ($run_number | tonumber),
              validation_only: ($validation_only == "true"),
              incomplete: ($incomplete == "true"),
              created_at: $created_at,
              services: $services
            }' \
            > "$MANIFEST_FILE"

          echo "manifest_file=$MANIFEST_FILE" >> "$GITHUB_OUTPUT"
          echo "manifest_name=$(basename "$MANIFEST_FILE")" >> "$GITHUB_OUTPUT"
          echo "incomplete=$INCOMPLETE" >> "$GITHUB_OUTPUT"

          jq . "$MANIFEST_FILE"

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ steps.manifest.outputs.manifest_file }}
          retention-days: 30

      - name: Manifest summary
        run: |
          {
            echo "## Environment Release Manifest"
            echo
            echo "- **Environment:** \`${{ github.ref_name }}\`"
            echo "- **Manifest:** \`${{ steps.manifest.outputs.manifest_name }}\`"
            echo "- **Git SHA:** \`${{ needs.release.outputs.sha }}\`"
            echo
            echo "| Service | Version | Image | Source |"
            echo "|---|---|---|---|"

            jq -r \
              '.services[] |
               "| `\(.slug)` | `\(.version)` | `\(.image_ref)` | `\(.source)` |"' \
              "${{ steps.manifest.outputs.manifest_file }}"
          } >> "$GITHUB_STEP_SUMMARY"
