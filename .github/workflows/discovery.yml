name: Repository discovery

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  discover:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the PR head rather than GitHub's synthetic merge commit so
          # discovery, affected analysis, and the downstream build use one SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Required for the affected-application comparisons below.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No pnpm-lock.yaml is committed yet, so do not enable setup-node's lockfile-based cache.
      - run: pnpm install --no-frozen-lockfile
      - name: Type-check repository discovery
        run: pnpm exec tsc --project .github/repository-discovery/tsconfig.json --noEmit
      - name: Test repository discovery
        run: pnpm exec vitest run .github/repository-discovery/tests
      - name: Discover applications and publish summary
        id: discovery
        run: pnpm exec tsx .github/repository-discovery/src/cli.ts . --output discovery-manifest.json
      - name: Publish discovered applications to the job summary
        run: pnpm exec tsx .github/repository-discovery/src/summary-cli.ts discovery-manifest.json
      - name: Resolve last successful build-and-test baseline
        id: baseline
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx .github/repository-discovery/src/baseline-cli.ts --repository "${{ github.repository }}" --branch "${{ github.ref_name }}" --head "${{ github.sha }}" --workflow ".github/workflows/build-and-test.yml"
      - name: Discover applications affected since the validated baseline
        if: ${{ github.event_name == 'push' && steps.baseline.outputs.mode == 'affected' }}
        run: pnpm exec tsx .github/repository-discovery/src/affected-cli.ts --base "${{ steps.baseline.outputs.base }}" --head "${{ github.sha }}" --output affected-manifest.json
      - name: Discover applications affected by this pull request
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec tsx .github/repository-discovery/src/affected-cli.ts --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --output affected-manifest.json
      - name: Select all applications for full validation
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.baseline.outputs.mode != 'affected') }}
        run: pnpm exec tsx .github/repository-discovery/src/all-affected-cli.ts --discovery discovery-manifest.json --output affected-manifest.json
      - name: Publish rebuild and versioning summary
        run: pnpm exec tsx .github/repository-discovery/src/affected-summary-cli.ts affected-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: discovery-manifest
          path: discovery-manifest.json
      - name: Upload affected-applications manifest
        uses: actions/upload-artifact@v7
        with:
          name: affected-applications-manifest
          path: affected-manifest.json
      - name: Start build and test when applications are affected
        # Fork PR tokens cannot dispatch workflows. Same-repository PRs use their
        # head branch so the downstream workflow definition matches the change.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx .github/repository-discovery/src/dispatch-build-cli.ts --affected affected-manifest.json --repository "${{ github.repository }}" --ref "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}" --source-sha "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" --discovery-run-id "${{ github.run_id }}" --workflow "build-and-test.yml"
