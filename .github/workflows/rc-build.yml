name: Build and tag a release candidate

on:
  workflow_call:
    inputs:
      app_id:
        description: Application id to version
        required: true
        type: string
      ref:
        description: Branch, tag, or commit SHA to build from
        required: true
        type: string
      bump:
        description: Version bump relative to this application's latest FINAL version (ignored the very first time; see initial_version)
        required: false
        type: string
        default: minor
      initial_version:
        description: Starting version (X.Y.Z) if this application has never been versioned before. Defaults to 0.1.0.
        required: false
        type: string
        default: ''
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      tag:
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: .github/repository-discovery
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve the exact commit checked out
        # Not github.sha: for workflow_dispatch that's the branch chosen in the "Run
        # workflow" dropdown, which can differ from the ref input above. Everything
        # downstream (the rc tag, the artifact) must point at what was actually built.
        id: checkout
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sha)) {
            throw 'Could not resolve the SHA of the checked-out commit.'
          }
          "sha=$sha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Read project toolchain versions
        id: toolchain
        run: node src/toolchain.mjs
      - uses: actions/setup-node@v7
        if: ${{ steps.toolchain.outputs.node != '' }}
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        if: ${{ steps.toolchain.outputs.pnpm != '' }}
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}
          package_json_file: .github/repository-discovery/package.json
          # Concurrent rc-build.yml runs for different applications share this
          # runner; a shared install path races on delete/recreate (EBUSY).
          # A unique path per application keeps concurrent builds independent.
          dest: ~/setup-pnpm-${{ inputs.app_id }}
      - run: pnpm install --frozen-lockfile
      - name: Resolve the application to version
        id: app
        run: pnpm exec tsx src/app-lookup-cli.ts --root ../.. --app-id "${{ inputs.app_id }}"
      - name: Compute the next release-candidate version
        id: version
        run: >
          pnpm exec tsx src/version-rc-cli.ts --root ../..
          --app-id "${{ inputs.app_id }}"
          --bump "${{ inputs.bump }}"
          --initial-version "${{ inputs.initial_version }}"
      - name: Read application toolchain versions
        id: app_toolchain
        env:
          PROJECT_PATH: ${{ steps.app.outputs.path }}
        run: node src/toolchain.mjs
      - uses: actions/setup-node@v7
        if: ${{ steps.app.outputs.ecosystem == 'node' && steps.app_toolchain.outputs.node != '' }}
        with:
          node-version: ${{ steps.app_toolchain.outputs.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        if: ${{ steps.app.outputs.ecosystem == 'node' && steps.app_toolchain.outputs.pnpm != '' }}
        with:
          version: ${{ steps.app_toolchain.outputs.pnpm }}
          package_json_file: .github/repository-discovery/package.json
          dest: ~/setup-pnpm-${{ inputs.app_id }}
      - uses: actions/setup-dotnet@v4
        if: ${{ steps.app.outputs.ecosystem == 'dotnet' && steps.app_toolchain.outputs.globalJson != '' }}
        with:
          global-json-file: ${{ steps.app_toolchain.outputs.globalJson }}
      - uses: microsoft/setup-msbuild@v2
        if: ${{ steps.app.outputs.project_system == 'legacy-msbuild' }}
      - name: Install Node dependencies
        if: ${{ steps.app.outputs.ecosystem == 'node' }}
        working-directory: ${{ steps.app.outputs.path }}
        run: pnpm install --no-frozen-lockfile
      - name: Build Node application
        if: ${{ steps.app.outputs.ecosystem == 'node' }}
        working-directory: ${{ steps.app.outputs.path }}
        run: pnpm run --if-present build
      - name: Test Node application
        if: ${{ steps.app.outputs.ecosystem == 'node' }}
        working-directory: ${{ steps.app.outputs.path }}
        run: pnpm run --if-present test
      - name: Build modern .NET application
        if: ${{ steps.app.outputs.ecosystem == 'dotnet' && steps.app.outputs.project_system == 'sdk-style' }}
        working-directory: ${{ steps.app.outputs.path }}
        run: dotnet build "${{ github.workspace }}/${{ steps.app.outputs.project_file }}" --configuration Release
      - name: Test modern .NET application
        if: ${{ steps.app.outputs.ecosystem == 'dotnet' && steps.app.outputs.project_system == 'sdk-style' }}
        working-directory: ${{ steps.app.outputs.path }}
        run: dotnet test "${{ github.workspace }}/${{ steps.app.outputs.project_file }}" --configuration Release --no-build
      - name: Build legacy .NET application
        if: ${{ steps.app.outputs.ecosystem == 'dotnet' && steps.app.outputs.project_system == 'legacy-msbuild' }}
        run: msbuild "${{ steps.app.outputs.project_file }}" /t:Build /p:Configuration=Release
      - name: Validate release-candidate artifact publication inputs
        shell: pwsh
        env:
          ARTIFACT_APP_ID: ${{ inputs.app_id }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_DIRECTORY: ${{ github.workspace }}/${{ steps.app.outputs.path }}
          ARTIFACT_REF: ${{ steps.checkout.outputs.sha }}
        run: |
          $required = @{
            'app-id' = $env:ARTIFACT_APP_ID
            'version' = $env:ARTIFACT_VERSION
            'app-directory' = $env:ARTIFACT_DIRECTORY
            'ref' = $env:ARTIFACT_REF
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "artifact-publish input(s) missing before invocation: $($missing -join ', ')."
          }
          Write-Host "artifact-publish inputs resolved for app '$env:ARTIFACT_APP_ID' (version '$env:ARTIFACT_VERSION', ref '$env:ARTIFACT_REF')."
      - name: Publish the release-candidate artifact to a GitHub Release
        # This is the rc's tag AND its stored artifact in one step: creating the
        # release also creates the underlying git tag at steps.checkout.outputs.sha,
        # so there is no separate tag/push step. See src/github-releases.ts and
        # src/artifact-publish-cli.ts to swap this for a different registry later.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_APP_ID: ${{ inputs.app_id }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_DIRECTORY: ${{ github.workspace }}/${{ steps.app.outputs.path }}
          ARTIFACT_REF: ${{ steps.checkout.outputs.sha }}
        shell: pwsh
        run: |
          & pnpm exec tsx src/artifact-publish-cli.ts `
            --app-id $env:ARTIFACT_APP_ID `
            --version $env:ARTIFACT_VERSION `
            --app-directory $env:ARTIFACT_DIRECTORY `
            --ref $env:ARTIFACT_REF
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Summarize
        env:
          RUN_ID: ${{ github.run_id }}
          APP_ID: ${{ inputs.app_id }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REF: ${{ inputs.ref }}
          SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          {
            echo "## Release candidate created"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow run ID | $RUN_ID |"
            echo "| Application | $APP_ID |"
            echo "| Version | $VERSION |"
            echo "| Tag | $TAG |"
            echo "| Built from | $REF ($SHA) |"
          } >> "$GITHUB_STEP_SUMMARY"
