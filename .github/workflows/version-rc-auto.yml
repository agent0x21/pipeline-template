name: Auto release candidates on main

# Automatically creates a release candidate for every application that has
# changed since its own last release-candidate build (see src/auto-rc.ts),
# on every push to main and every pull request targeting main. This replaces
# the plain build-and-test.yml dispatch that discovery.yml would otherwise
# run for these events (see the guard in discovery.yml) — rc-build.yml
# already builds and tests as part of creating the rc, so main commits are
# never built twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

# Candidate discovery relies on the RC tags created by earlier runs as each
# application's baseline. Serialize the entire main-push workflow, rather than
# only its per-app build jobs: otherwise a newer push can do discovery before
# the older run has published its tags and incorrectly select apps from both
# pushes. Do not cancel an in-progress run: its tags must be available as the
# baseline before the next queued main commit performs discovery.
concurrency:
  group: auto-rc-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-auto-rc:
    # Tagging requires push access, which GitHub does not grant the default
    # token for pull_request runs from a fork. Same restriction discovery.yml
    # already applies to its own build dispatch.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: self-hosted
    defaults:
      run:
        working-directory: .github/repository-discovery
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_affected: ${{ steps.matrix.outputs.has_affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Read project toolchain versions
        id: toolchain
        run: node src/toolchain.mjs
      - uses: actions/setup-node@v7
        if: ${{ steps.toolchain.outputs.node != '' }}
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        if: ${{ steps.toolchain.outputs.pnpm != '' }}
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}
          package_json_file: .github/repository-discovery/package.json
      - run: pnpm install --frozen-lockfile
      - name: Type-check repository discovery
        run: pnpm run typecheck:discovery
      - name: Test repository discovery
        run: pnpm run test:discovery
      - name: Determine applications changed since their own last release candidate
        id: matrix
        run: pnpm exec tsx src/auto-rc-cli.ts --root ../..

  create-rc:
    name: Create rc (${{ matrix.name }})
    needs: discover-auto-rc
    if: ${{ needs.discover-auto-rc.outputs.has_affected == 'true' }}
    strategy:
      # Independent per application: one app's build/test failure does not
      # block or cancel rc creation for the others in the same push/PR.
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-auto-rc.outputs.matrix) }}
    # Serializes rc creation per application (across overlapping pushes/PRs, not
    # across different applications in the same run — those still run in
    # parallel). Without this, two concurrent runs touching the same app could
    # both compute the same next rc.N and race pushing the tag.
    concurrency:
      group: rc-${{ matrix.id }}
    uses: ./.github/workflows/rc-build.yml
    with:
      app_id: ${{ matrix.id }}
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      bump: minor
